<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="/">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--ink:#37352f;--mute:#787774;--line:#e9e9e7;--card:#ffffff;--acc:#2383e2;--red:#e03e3e;--yel:#cb912f;--ok:#448361;--warn:#d9730d;--bad:#e03e3e;--soft:#f7f7f5;
 --g-bg:#e3e2e0;--g-t:#32302c;--g-c:#f7f7f5;--b-bg:#d3e5ef;--b-t:#183347;--b-c:#f3f8fb;--gr-bg:#dbeddb;--gr-t:#1c3829;--gr-c:#f4f8f4;--o-bg:#fadec9;--o-t:#49290e;--o-c:#fcf6f1;--r-bg:#ffe2dd;--r-t:#5d1715;--y-bg:#fdecc8;--y-t:#402c1b;--p-bg:#e8deee;--p-t:#412454}
body{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,'Be Vietnam Pro',sans-serif !important}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--acc)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header{background:#fbfbfa;color:var(--ink);border-bottom:1px solid var(--line);padding:14px max(4vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header small{opacity:.7}header a{color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 60px}
h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:0}
.lead{color:var(--mute);margin:0 0 14px;max-width:75ch}
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.atabs button{flex:none;min-height:36px;border:1px solid transparent;background:transparent;border-radius:99px;padding:0 14px;font-weight:600}
.atabs button.on{background:#efefed;color:var(--ink);border-color:var(--line)}
.atabs button{color:var(--mute)}.atabs button:hover{background:#f1f1ef}
.atabs .n{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.panel{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--card);margin-bottom:14px}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:14px;font-weight:600}
.f input,.f select,.f textarea,.filters input,.filters select{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);font-size:16px;width:100%}
.f textarea{padding:10px 12px;min-height:80px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filters>*{flex:1 1 200px}
.btn{min-height:40px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-weight:600;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.alt:hover{background:var(--soft)}.btn.red{background:var(--red)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.crow{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.crow img{width:52px;height:64px;object-fit:cover;border-radius:6px;background:var(--soft)}
.crow select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px;width:100%;max-width:260px}
.crow.ch select{border:2px solid var(--yel)}
.chk{display:grid;gap:8px;margin:10px 0}.chk label{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft)}
.tag.live,.tag.back{color:var(--ok)}.tag.review,.tag.wait{color:var(--warn)}.tag.hidden,.tag.done{color:var(--mute)}
.tag.back{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.in{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
pre.out{background:var(--soft);padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:240px;overflow:auto}
.empty{color:var(--mute);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.tb button{min-height:34px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:0 10px;font-size:13px;font-weight:600}
#body{min-height:360px;font-size:16px;line-height:1.6}
.coverp{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--soft);display:block}
.prose{max-width:680px;font-size:17px;line-height:1.75;background:#fff;color:#16181d;padding:24px;border-radius:12px}
.prose h3{font-size:26px;margin:28px 0 8px}.prose h4{font-size:19px}
.prose blockquote{font-family:"Playfair Display",serif;font-style:italic;font-size:26px;line-height:1.3;margin:28px 0}
.prose figure{margin:24px 0}.prose img{width:100%;border-radius:4px}.prose figcaption{font-size:13px;color:#666}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages button{min-height:36px;border:0;background:transparent;color:var(--mute);border-radius:99px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pages button.on{background:#efefed;color:var(--ink)}.pages button:hover{background:#f1f1ef}
.pages .n,.atabs .n{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:6px}
.kb{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--cc);border-radius:12px;padding:12px;min-height:200px}
.kcol.over{outline:2px dashed var(--pc);outline-offset:-4px}
.kcol .kh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pc);color:var(--ink);border-radius:99px;padding:3px 12px 3px 10px;font-weight:600;font-size:14px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.kcol .kh .cnt{color:var(--dot);font-weight:600}
.kcol .desc{color:var(--mute);font-size:12px;margin:0 0 10px}
.kempty{text-align:center;padding:20px 0;color:var(--mute)}
.jc{display:grid;gap:7px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,15,15,.06);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.jc:hover{background:#fafaf9}.jc.sel{border-color:var(--acc)}
.jh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jn{font-weight:600;font-size:16px}.jid{font-size:12px;color:var(--mute)}
.jic{display:flex;gap:6px;flex-wrap:wrap}
.inqp summary{cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.inqp .n{background:var(--r-bg);color:var(--r-t);border-radius:99px;padding:0 8px;font-size:12px;font-weight:600}
.inql{display:grid;gap:12px;margin:14px 0 10px}.inqi{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.inqi.dn{opacity:.55}
.inqt{display:flex;gap:6px}.inqt img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
@media(max-width:600px){.inqi{grid-template-columns:1fr}}
.hclips{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin:10px 0 0}.hclip{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px;border:1px solid var(--line);border-radius:8px}.hclip video,.hclip img{width:110px;height:140px;object-fit:cover;border-radius:6px;background:#111}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;margin-top:14px}.qrc{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;margin:0}.qri svg{display:block;border:1px solid var(--line);border-radius:6px}
.qrs{display:flex;gap:18px;flex-wrap:wrap}.qrs span{font-size:12px;color:var(--mut,#787774);display:flex;flex-direction:column}.qrs b{font-size:18px;color:var(--ink)}
@media(max-width:600px){.qrgrid{grid-template-columns:1fr}.qrc{grid-template-columns:110px 1fr}.qri svg{width:110px;height:110px}#qrForm{grid-template-columns:1fr!important}}
.tg{font-style:normal;font-size:12px;font-weight:500;border-radius:4px;padding:1px 7px;color:var(--ink)}
.tg.g{background:var(--g-bg);color:var(--g-t)}.tg.b{background:var(--b-bg);color:var(--b-t)}.tg.gr{background:var(--gr-bg);color:var(--gr-t)}.tg.o{background:var(--o-bg);color:var(--o-t)}.tg.r{background:var(--r-bg);color:var(--r-t)}.tg.y{background:var(--y-bg);color:var(--y-t)}.tg.p{background:var(--p-bg);color:var(--p-t)}
.jt{font-size:13px;color:var(--mute)}
.jp{height:4px;background:#ededeb;border-radius:99px;overflow:hidden}.jp span{display:block;height:100%;background:var(--dot)}
.addo{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;border:1px solid var(--line);background:transparent;color:var(--dot);border-radius:10px;padding:0 14px;font-size:14px}
.oveil{position:fixed;inset:0;background:rgba(15,15,15,.25);display:none;z-index:30}.oveil.on{display:block}
.odr{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--bg);box-shadow:-8px 0 24px rgba(15,15,15,.08);z-index:31;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.odr.on{transform:none}#odrBody{display:flex;flex-direction:column;height:100%}
.dhd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfbfa}
.dsc{padding:14px 18px 40px;overflow-y:auto;flex:1}
.x{width:40px;height:40px;border:0;border-radius:10px;background:var(--soft);font-size:22px;color:var(--ink)}
.dt{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
table.mini{border-collapse:collapse;font-size:14px}table.mini td{padding:3px 16px 3px 0}
.av{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:34px}.av button{border:0;background:#fff;padding:0 10px;font-size:13px;color:var(--mute)}.av button+button{border-left:1px solid var(--line)}.av button.on.ok{background:var(--gr-bg);color:var(--gr-t);font-weight:600}.av button.on.no{background:var(--r-bg);color:var(--r-t);font-weight:600}
.ffrow{display:grid;grid-template-columns:1fr auto 170px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ffrow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 6px;font-size:13px}
.ff.at_hub,.ff.shipped_au{border-color:var(--ok);color:var(--ok)}.ff.unavailable{color:var(--bad)}.ff.ordered,.ff.brand_shipped{border-color:var(--warn);color:var(--warn)}
@media(max-width:600px){.ffrow{grid-template-columns:1fr 1fr}.ffrow>div:first-child{grid-column:1/-1}.kb{grid-template-columns:repeat(3,minmax(250px,85vw))}}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-right:8px}
.costbox{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.costbox table.mini td:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:#16181d;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;transition:transform .2s;font-size:15px;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div><b>Admin</b> <small>chỉ chạy trên máy của bạn</small></div><nav class="pages" id="pages"></nav><div class="mrow"><a href="/" target="_blank" rel="noopener">Mở website khách ↗</a></div></header>
<div class="wrap" id="box"></div>
<div class="oveil" id="oveil" data-closeo></div>
<aside class="odr" id="odr" aria-label="Chi tiết đơn"><div id="odrBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script src="common.js"></script>
<script src="/admin/qrcode.js"></script>
<script>
{
const {SKIP,esc,CATS,D,vnd,ago,st,rec,catOf,slug,md}=CV;
const $=id=>document.getElementById(id);
const VER=[['web','Website chính thức: domain đúng tên brand, có HTTPS, có trang liên hệ'],['ig','Instagram chính chủ: bio có link về đúng website'],['biz','Thông tin doanh nghiệp: tên công ty, mã số thuế hoặc địa chỉ trên website'],['contact','Đã liên hệ, brand đồng ý cho dùng ảnh (không bắt buộc để duyệt)']];
const TAGS=['Celeb mặc đồ Việt','Chất liệu','Câu chuyện brand','Xu hướng','Lịch sử & di sản','Hướng dẫn'];
let page=(()=>{try{return sessionStorage.getItem('cv_page')||'orders'}catch(e){return 'orders'}})(),kwList=[],pendKw={},warns=[],warnAt='',pw='',tab='warn',selP=new Set(),pend={},catFilter='all',catQ='',brandQ='',limitP=60,syncTxt='',notes=[],editing=null,preview=false;
try{pw=sessionStorage.getItem('cv_pw')||''}catch(e){}
let tt;const toast=(m,ms=2400)=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),ms)};
async function api(path,body,method='POST'){
 try{const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:method==='GET'?undefined:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(r.status===401){pw='';try{sessionStorage.removeItem('cv_pw')}catch(e){}}return {ok:r.ok,status:r.status,j}}
 catch(e){return {ok:false,status:0,j:{error:'Không kết nối được máy chủ. Hãy chạy: python3 serve.py'}}}}
const saveFile=async(file,data)=>{if(file==='settings.json'&&data.rate_manual!=null){const{rate_manual,...rest}=data;data={...rest,rate:rate_manual}}   // không lưu tỷ giá tự động thành tỷ giá tay
 const r=await api('/api/save',{file,data});toast(r.ok?'Đã lưu':(r.j.error||'Lưu không được'));if(r.status===401)render();return r.ok};
function isBack(n){const p=D.byId[n.pid];if(!p)return false;if(!n.variant)return p.in_stock;const v=p.variants.find(x=>x.name===n.variant);return !!v&&v.available}

function render(){
 if(!pw){$('pages').innerHTML='';$('box').innerHTML=`<div class="panel" style="max-width:420px;margin:40px auto"><h2>Đăng nhập</h2><form class="f" id="loginForm"><label>Mật khẩu admin<input type="password" name="pw" required autocomplete="current-password" autofocus></label><button class="btn">Vào</button><p class="note" id="loginMsg"></p></form></div>`;return}
 const left=D.products.filter(p=>catOf(p)==='Khác'&&!D.ov[p.id]?.category).length,back=notes.filter(n=>!n.done&&isBack(n)).length,rv=D.status.filter(b=>rec(b.id).status==='review').length;
 const hi=warns.filter(w=>w.level!=='low').length;
 const newO=orders.filter(o=>(o.status||'new')==='new').length;
 $('pages').innerHTML=`<button class="${page==='orders'?'on':''}" data-page="orders">Quản lý đơn hàng${newO?`<span class="n">${newO}</span>`:''}</button><button class="${page==='shop'?'on':''}" data-page="shop">Quản lý sàn${hi?`<span class="n">${hi}</span>`:''}</button><button data-logout>Thoát</button>`;
 if(page==='orders')return pageOrders();
 const T=[['warn','Cảnh báo',hi],['cat','Sản phẩm',left],['cats','Danh mục'],['content','Nội dung web'],['brand','Brand',rv],['notify','Chờ hàng',back],['journal','Journal'],['clip','Moodboard'],['qr','QR code'],['set','Cài đặt & đồng bộ']];
 if(tab==='order')tab='warn';
 $('box').innerHTML=`<div class="atabs">${T.map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</div><div id="aBody"></div>`;
 ({cats:tCats,content:tContent,warn:tWarn,cat:tCat,brand:tBrand,notify:tNotify,journal:tJournal,clip:tClip,qr:tQr,set:tSet})[tab]();
}
const ovOf=p=>D.ov[p.id]||{};
const pins=()=>D.products.filter(p=>ovOf(p).pin).sort((a,b)=>ovOf(a).pin-ovOf(b).pin);
async function saveOv(mut){const ov=JSON.parse(JSON.stringify(D.ov));mut(ov);for(const k in ov){const m=ov[k];if(!m.title)delete m.title;if(!m.hidden)delete m.hidden;if(!m.pin)delete m.pin;if(!Object.keys(m).length)delete ov[k]}if(await saveFile('overrides.json',ov)){D.ov=ov;return true}return false}
const renum=ov=>{Object.entries(ov).filter(([,m])=>m.pin).sort((a,b)=>a[1].pin-b[1].pin).forEach(([,m],i)=>m.pin=i+1)};
const setPend=(id,k,v)=>{const p=D.byId[id],o=ovOf(p),cur={category:o.category??catOf(p),title:o.title??'',hidden:!!o.hidden};pend[id]={...(pend[id]||{}),[k]:v};if(Object.entries(pend[id]).every(([kk,vv])=>cur[kk]===vv))delete pend[id]};
/* --- danh mục --- */
const catRows=()=>CATS.map(k=>({key:k,en:CV.catEN(k),hidden:CV.catHidden(k),custom:!CV.BASE_CATS.includes(k)}));
async function saveCats(rows){const s={...D.set,cats:rows.map(({key,en,hidden})=>({key,en,hidden}))};if(await saveFile('settings.json',s)){D.set=s;CV.applyCats();render()}}
function tCats(){
 const rows=catRows(),cnt=k=>D.products.filter(p=>catOf(p)===k&&!ovOf(p).hidden).length;
 $('aBody').innerHTML=`<div class="panel"><h3>Danh mục trên web</h3><p class="note">Đổi tên tiếng Anh khách thấy, sắp xếp thứ tự (thứ tự này dùng cho các tab trên web), hoặc ẩn cả danh mục. Danh mục bị ẩn thì mọi sản phẩm trong đó cũng ẩn. "Khác" luôn nằm cuối.</p>
 ${rows.map((c,i)=>`<div class="crow" style="grid-template-columns:1fr auto;${c.hidden?'opacity:.55':''}"><div><div class="note" style="margin:0">${esc(c.key)}${c.custom?' · danh mục tự thêm':''} · ${cnt(c.key)} sản phẩm</div>
  <div class="mrow" style="margin-top:6px;align-items:center"><input data-caten="${esc(c.key)}" value="${esc(c.en)}" style="flex:1 1 220px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card)" aria-label="Tên tiếng Anh">
  <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" data-cathide="${esc(c.key)}" ${c.hidden?'checked':''} style="width:18px;height:18px"> Ẩn</label></div></div>
  <div class="mrow">${c.key==='Khác'?'':`<button class="btn sm alt" data-cup="${i}" ${i?'':'disabled'} aria-label="Lên">↑</button><button class="btn sm alt" data-cdown="${i}" ${i<rows.length-2?'':'disabled'} aria-label="Xuống">↓</button>`}${c.custom?`<button class="btn sm alt" data-cdel="${esc(c.key)}" style="color:var(--bad)">Xoá</button>`:''}</div></div>`).join('')}</div>
 <div class="panel"><h3>Thêm danh mục</h3><p class="note">Sau khi thêm, đưa sản phẩm vào bằng tab Sản phẩm (chọn nhiều món → Đổi danh mục) hoặc gán từ khoá.</p>
 <form class="f" id="addCat" style="margin-top:8px"><div class="two"><label>Tên tiếng Việt (để bạn nhận biết)<input name="key" required placeholder="VD: Đồ đôi"></label><label>Tên tiếng Anh khách thấy<input name="en" required placeholder="VD: Matching sets"></label></div><button class="btn">Thêm danh mục</button></form></div>`;
}
/* --- nội dung web --- */
let draftC=null;
const inpS='width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:15px';
function tContent(){

async function shrink(file,max=1800){   // ảnh lớn thì thu nhỏ còn cạnh dài 1800px để web nhẹ
 const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});
 if((file.size<1.2e6&&max<=1800)||file.type==='image/gif')return url;
 if(max>1800&&file.size<3e6)return url;   // ảnh trang chủ: file vừa phải thì giữ nguyên gốc cho nét
 try{const img=await createImageBitmap(file),k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',max>1800?.92:.85)}catch(e){return url}
}

  {const it=/^[✓✗•] /.test(tl)&&o.items.find(i=>tl.includes(i.title));if(it){const img=it.image||D.byId[it.pid]?.images?.[0]||'';

  out.push(`<p style="margin:2px 0">${mdB(l)}</p>`)}
 return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#1a1a2e;max-width:560px">${out.join('')}</div>`;

  const {rate_manual,...clean}=s;if(await saveFile('settings.json',clean)){await CV.load('/');render()}}
 if(f.id==='clipForm'){const b=$('clipBtn');b.disabled=true;b.textContent='Đang lấy thông tin clip…';
  const r=await api('/api/clip',{url:f.url.value.trim()});b.disabled=false;b.textContent='Lấy thumbnail & thêm';
  if(!r.ok)return toast(r.j.error||'Không thêm được');
  const c={...r.j,brand:f.brand.value,country:f.country.value.trim(),cap:f.cap.value.trim(),added:new Date().toISOString()};
  if(!c.thumb)c.thumb=await browserThumb(c.url);
  const cl=[c,...D.clips.filter(x=>x.id!==c.id)];if(await saveFile('clips.json',cl)){D.clips=cl;render();toast(c.thumb?'Đã thêm clip':'Đã thêm. Chưa lấy được ảnh: bấm "Tự tải ảnh lên" ở clip bên dưới')}}
 if(f.id==='artForm'){syncForm();const a=editing;if(!a.title.trim())return toast('Cần tiêu đề');
  let s=a.slug||slug(a.title);while(D.articles.some(x=>x.slug===s&&x.id!==a.id))s+='-2';a.slug=s;
  const list=[a,...D.articles.filter(x=>x.id!==a.id)];if(await saveFile('articles.json',list)){D.articles=list;toast(a.status==='published'?'Đã lưu và đăng':'Đã lưu bản nháp')}}
});
/* --- QR code: mỗi chỗ đặt một mã riêng (?src=...) để biết khách đến từ đâu --- */
let qrList=null,scans={};
const QR_DEST=[['','Trang Shop'],['#moodboard','Moodboard'],['#journal','Journal']];
const qrName=s=>(qrList||[]).find(q=>q.slug===s)?.name||s;
const qrUrl=q=>{const base=(D.set.site_url||'').replace(/\/+$/,'');return base?`${base}/?src=${q.slug}${q.dest||''}`:''};
async function loadQr(){const a=await api('/api/private?file=qr.json',null,'GET'),b=await api('/api/private?file=scans.json',null,'GET');qrList=a.ok&&Array.isArray(a.j.codes)?a.j.codes:[];scans=b.ok&&b.j&&!b.j.error?b.j:{}}
async function saveQr(list){const r=await api('/api/private-save',{file:'qr.json',data:{codes:list}});if(r.ok){qrList=list;return true}toast(r.j.error||'Lưu không được');return false}
function qrMake(text){const q=qrcode(0,'M');q.addData(text);q.make();return q}
function qrSvg(text,px){const q=qrMake(text),n=q.getModuleCount(),m=4,t=n+m*2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${t} ${t}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`}
function qrStats(slug){const os=orders.filter(o=>o.src===slug&&o.status!=='cancelled');return {scan:scans[slug]?.count||0,last:scans[slug]?.last||'',n:os.length,rev:os.reduce((a,o)=>a+Number(o.totals?.total||0),0)}}
function qrPng(q){   // ảnh in: mã QR + chữ VIEBUY + dòng mời quét
 const url=qrUrl(q),qq=qrMake(url),n=qq.getModuleCount(),W=1200,cell=Math.floor(W/(n+8)),size=cell*n,off=(W-size)/2,H=W+260;
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#111';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qq.isDark(r,c))x.fillRect(off+c*cell,off+r*cell,cell,cell);
 x.textAlign='center';x.font='800 96px "Be Vietnam Pro",Helvetica,Arial,sans-serif';x.fillText((D.set.site_name||'VieBuy').toUpperCase(),W/2,W+70);
 x.font='500 42px "Be Vietnam Pro",Helvetica,Arial,sans-serif';x.fillStyle='#555';x.fillText(q.caption||'Scan to shop Vietnamese brands',W/2,W+150);
 const a=document.createElement('a');a.download=`qr-${q.slug}.png`;a.href=cv.toDataURL('image/png');a.click()}
function qrDl(name,text,type){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([text],{type}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function tQr(){
 if(qrList===null){$('aBody').innerHTML='<div class="panel"><p class="note">Đang tải…</p></div>';await loadQr()}
 const base=(D.set.site_url||'').trim(),known=new Set(qrList.map(q=>q.slug));
 const extra=[...new Set([...Object.keys(scans),...orders.map(o=>o.src).filter(Boolean)])].filter(s=>!known.has(s));
 const tot=qrList.concat(extra.map(s=>({slug:s}))).map(q=>qrStats(q.slug)).reduce((a,b)=>({scan:a.scan+b.scan,n:a.n+b.n,rev:a.rev+b.rev}),{scan:0,n:0,rev:0});
 $('aBody').innerHTML=`<div class="panel"><h3>QR code</h3><p class="note">Mỗi chỗ đặt mã (poster, card trong gói hàng, Instagram…) nên có một mã riêng. Khách quét mã nào thì đơn của họ sẽ có tag <i class="tg y">QR: tên chỗ đặt</i>, và bảng dưới đếm lượt quét, số đơn, doanh thu cho từng mã. Lượt quét cập nhật khi bấm "Lấy đơn mới".</p>
 ${base?'':'<p class="note" style="color:var(--r-t)">Chưa có "Link web online" (Cài đặt → Online) nên chưa tạo được link cho mã.</p>'}
 <form class="f" id="qrForm" style="display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:10px;align-items:end;margin-top:12px">
  <label>Chỗ đặt mã<input name="name" required placeholder="vd: Poster thư viện UQ" maxlength="60"></label>
  <label>Mã ngắn (trong link)<input name="slug" placeholder="tự tạo từ tên" maxlength="24" pattern="[a-z0-9-]*"></label>
  <label>Mở ra trang<select name="dest">${QR_DEST.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>
  <button class="btn">+ Tạo mã</button></form>
 <p class="note" style="margin-top:14px">Tổng: <b>${tot.scan}</b> lượt quét · <b>${tot.n}</b> đơn · <b>A$${tot.rev.toFixed(2)}</b>${tot.scan?` · ${(tot.n/tot.scan*100).toFixed(1)}% quét thành đơn`:''}</p></div>
 <div class="qrgrid">${qrList.map((q,i)=>{const st=qrStats(q.slug),url=qrUrl(q);return `<div class="panel qrc">
  <div class="qri">${url?qrSvg(url,150):''}</div>
  <div><h3 style="margin:0">${esc(q.name)}</h3><p class="note" style="margin:2px 0 8px;word-break:break-all">${esc(url||'?src='+q.slug)}</p>
  <div class="qrs"><span><b>${st.scan}</b>lượt quét</span><span><b>${st.n}</b>đơn</span><span><b>A$${st.rev.toFixed(0)}</b>doanh thu</span><span><b>${st.scan?(st.n/st.scan*100).toFixed(0)+'%':'–'}</b>quét → đơn</span></div>
  ${st.last?`<p class="note" style="margin:6px 0 0">Quét gần nhất: ${esc(new Date(st.last+(st.last.endsWith('Z')?'':'Z')).toLocaleString('vi-VN'))}</p>`:''}
  <label class="note" style="display:block;margin-top:8px">Dòng chữ dưới mã khi tải PNG<input data-qrcap="${i}" value="${esc(q.caption||'Scan to shop Vietnamese brands')}" maxlength="50" style="width:100%;min-height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;margin-top:4px"></label>
  <div class="mrow" style="margin-top:10px;flex-wrap:wrap">${url?`<button class="btn" data-qrpng="${i}">Tải PNG (in)</button><button class="btn alt" data-qrsvg="${i}">Tải SVG</button><button class="btn alt" data-qrcopy="${i}">Copy link</button>`:''}<button class="btn alt" data-qrdel="${i}" style="margin-left:auto">Xoá</button></div></div></div>`}).join('')}</div>
 ${extra.length?`<div class="panel"><h3>Nguồn khác</h3><p class="note">Có lượt quét hoặc đơn nhưng chưa có trong danh sách (mã đã xoá, hoặc link ?src= bà tự gõ).</p>${extra.map(s=>{const st=qrStats(s);return `<p class="note" style="margin:4px 0"><b>${esc(s)}</b> · ${st.scan} lượt quét · ${st.n} đơn · A$${st.rev.toFixed(0)}</p>`}).join('')}</div>`:''}`;
 const f=$('qrForm');f.name.oninput=()=>{if(!f.slug.dataset.touched)f.slug.value=slug(f.name.value).slice(0,24)};f.slug.oninput=()=>{f.slug.dataset.touched=1;f.slug.value=f.slug.value.toLowerCase().replace(/[^a-z0-9-]/g,'')};
 f.onsubmit=async e=>{e.preventDefault();const s=(f.slug.value||slug(f.name.value)).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24);if(!s)return toast('Cần tên chỗ đặt');if(qrList.some(q=>q.slug===s))return toast('Mã "'+s+'" đã có, đặt mã ngắn khác nhé');
  if(await saveQr([{slug:s,name:f.name.value.trim(),dest:f.dest.value,caption:'Scan to shop Vietnamese brands',created:new Date().toISOString().slice(0,10)},...qrList])){toast('Đã tạo mã');tQr()}};
 $('aBody').onclick=async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.qrpng!==undefined)qrPng(qrList[+d.qrpng]);
  else if(d.qrsvg!==undefined){const q=qrList[+d.qrsvg];qrDl(`qr-${q.slug}.svg`,qrSvg(qrUrl(q),1000),'image/svg+xml')}
  else if(d.qrcopy!==undefined){try{await navigator.clipboard.writeText(qrUrl(qrList[+d.qrcopy]));toast('Đã copy link')}catch(x){toast('Không copy được')}}
  else if(d.qrdel!==undefined){const q=qrList[+d.qrdel];if(!confirm(`Xoá mã "${q.name}"? Mã đã in ra vẫn dẫn vào web bình thường, chỉ là không còn hiện trong danh sách này.`))return;if(await saveQr(qrList.filter((_,i)=>i!==+d.qrdel))){toast('Đã xoá');tQr()}}};
 $('aBody').onchange=async e=>{const i=e.target.dataset.qrcap;if(i===undefined)return;const list=qrList.map((q,k)=>k===+i?{...q,caption:e.target.value.trim()}:q);if(await saveQr(list))toast('Đã lưu dòng chữ')};
}
async function loadRemote(){const q=await api('/api/private?file=remote.json',null,'GET');remote=q.ok?q.j:{}}
async function pullOnline(quiet){if(!quiet)toast('Đang lấy đơn…');
 const r=await api('/api/pull',{});if(!r.ok)return toast(r.j.error||'Không lấy được');const j=r.j;await loadOrders();await loadQr();if(j.data){await CV.load('/');await loadWarns()}
 await loadInq();renderInq();
 const m=[j.orders?j.orders+' đơn mới':'',j.inquiries?j.inquiries+' yêu cầu tìm hàng':'',j.updated?j.updated+' đơn khách đã đổi món':'',j.notify?j.notify+' đăng ký báo hàng':'',j.data?'dữ liệu sản phẩm mới':''].filter(Boolean).join(', ');
 const msg=[m?'Đã lấy: '+m:'',...j.msgs].filter(Boolean).join(' · ')||'Không có đơn mới';
 if(m||j.msgs.length||!quiet)toast(msg,j.msgs.length?9000:undefined);render()}
async function loadPay(){const q=await api('/api/private?file=payment.json',null,'GET');payInfo=q.ok?(q.j.text||''):'';contact=q.ok?{name:q.j.sign_name||'',phone:q.j.phone||'',email:q.j.email||''}:{}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId){openId=null;composing=null;redraw()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',async e=>{const col=e.target.closest?.('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain'),o=orders.find(x=>x.id===id),C=COLS.find(c=>c.k===col.dataset.drop);if(!o||!C||C.st.includes(o.status||'new'))return;await setStatus(id,C.k==='c1'&&!o.confirm?'new':C.to)});
CV.load('/').then(async()=>{if(pw){await loadNotes();await loadWarns();await loadPay();await loadRemote();await loadOrders();await loadQr()}render();if(pw)pullOnline(true)});
}
