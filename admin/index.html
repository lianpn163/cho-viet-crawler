<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<base href="/">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#191919;--ink:#e3e2e0;--mute:#9b9a97;--line:#2f2f2f;--card:#252525;--acc:#2383e2;--red:#e16259;--yel:#dfab01;--ok:#4dab9a;--warn:#d9730d;--bad:#e16259;--soft:#2c2c2c;
 --g-bg:#373737;--g-c:#2a2a2a;--b-bg:#28456c;--b-c:#1d2a3a;--gr-bg:#2b593f;--gr-c:#1e2c24;--o-bg:#5c3b23;--o-c:#2e241c;--r-bg:#6e3630;--y-bg:#564328;--p-bg:#492f64}
body{font-family:ui-sans-serif,-apple-system,'Segoe UI',Helvetica,'Be Vietnam Pro',sans-serif !important}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--acc)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
header{background:#191919;color:var(--ink);border-bottom:1px solid var(--line);padding:14px max(4vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header small{opacity:.7}header a{color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 60px}
h2{font-size:22px;margin:0 0 10px}h3{font-size:17px;margin:0}
.lead{color:var(--mute);margin:0 0 14px;max-width:75ch}
.atabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.atabs button{flex:none;min-height:36px;border:1px solid transparent;background:transparent;border-radius:99px;padding:0 14px;font-weight:600}
.atabs button.on{background:#2c2c2c;color:var(--ink);border-color:#3a3a3a}
.atabs button{color:var(--mute)}.atabs button:hover{background:#252525}
.atabs .n{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);margin-bottom:14px}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:14px;font-weight:600}
.f input,.f select,.f textarea,.filters input,.filters select{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);font-size:16px;width:100%}
.f textarea{padding:10px 12px;min-height:80px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filters>*{flex:1 1 200px}
.btn{min-height:42px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--red)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.mrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.crow{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.crow img{width:52px;height:64px;object-fit:cover;border-radius:6px;background:var(--soft)}
.crow select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px;width:100%;max-width:260px}
.crow.ch select{border:2px solid var(--yel)}
.chk{display:grid;gap:8px;margin:10px 0}.chk label{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft)}
.tag.live,.tag.back{color:var(--ok)}.tag.review,.tag.wait{color:var(--warn)}.tag.hidden,.tag.done{color:var(--mute)}
.tag.back{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.in{color:var(--ok)}.err{color:var(--bad)}.warn{color:var(--warn)}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
pre.out{background:var(--soft);padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:240px;overflow:auto}
.empty{color:var(--mute);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.tb button{min-height:34px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:0 10px;font-size:13px;font-weight:600}
#body{min-height:360px;font-size:16px;line-height:1.6}
.coverp{width:120px;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--soft);display:block}
.prose{max-width:680px;font-size:17px;line-height:1.75;background:#fff;color:#16181d;padding:24px;border-radius:12px}
.prose h3{font-size:26px;margin:28px 0 8px}.prose h4{font-size:19px}
.prose blockquote{font-family:"Playfair Display",serif;font-style:italic;font-size:26px;line-height:1.3;margin:28px 0}
.prose figure{margin:24px 0}.prose img{width:100%;border-radius:4px}.prose figcaption{font-size:13px;color:#666}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pages button{min-height:36px;border:0;background:transparent;color:var(--mute);border-radius:99px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pages button.on{background:#2c2c2c;color:var(--ink)}.pages button:hover{background:#2a2a2a}
.pages .n,.atabs .n{background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:6px}
.kb{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--cc);border-radius:12px;padding:12px;min-height:200px}
.kcol.over{outline:2px dashed var(--pc);outline-offset:-4px}
.kcol .kh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pc);color:#fff;border-radius:99px;padding:3px 12px 3px 10px;font-weight:600;font-size:14px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.kcol .kh .cnt{color:var(--dot);font-weight:600}
.kcol .desc{color:var(--mute);font-size:12px;margin:0 0 10px}
.kempty{text-align:center;padding:20px 0;color:var(--mute)}
.jc{display:grid;gap:7px;width:100%;text-align:left;background:var(--cardc);border:1px solid #ffffff14;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);transition:background .12s}
.jc:hover{background:#ffffff0d}.jc.sel{border-color:var(--acc)}
.jh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jn{font-weight:600;font-size:16px}.jid{font-size:12px;color:var(--mute)}
.jic{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-style:normal;font-size:12px;font-weight:500;border-radius:4px;padding:1px 7px;color:#fff}
.tg.g{background:var(--g-bg)}.tg.b{background:var(--b-bg)}.tg.gr{background:var(--gr-bg)}.tg.o{background:var(--o-bg)}.tg.r{background:var(--r-bg)}.tg.y{background:var(--y-bg)}.tg.p{background:var(--p-bg)}
.jt{font-size:13px;color:var(--mute)}
.jp{height:4px;background:#ffffff14;border-radius:99px;overflow:hidden}.jp span{display:block;height:100%;background:var(--dot)}
.addo{display:flex;align-items:center;gap:8px;width:100%;min-height:42px;border:1px solid #ffffff14;background:transparent;color:var(--dot);border-radius:10px;padding:0 14px;font-size:14px}
.oveil{position:fixed;inset:0;background:#0006;display:none;z-index:30}.oveil.on{display:block}
.odr{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.odr.on{transform:none}#odrBody{display:flex;flex-direction:column;height:100%}
.dhd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
.dsc{padding:14px 18px 40px;overflow-y:auto;flex:1}
.x{width:40px;height:40px;border:0;border-radius:10px;background:var(--soft);font-size:22px;color:var(--ink)}
.dt{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
table.mini{border-collapse:collapse;font-size:14px}table.mini td{padding:3px 16px 3px 0}
.ffrow{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ffrow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 6px;font-size:13px}
.ff.at_hub,.ff.shipped_au{border-color:var(--ok);color:var(--ok)}.ff.unavailable{color:var(--bad)}.ff.ordered,.ff.brand_shipped{border-color:var(--warn);color:var(--warn)}
@media(max-width:600px){.ffrow{grid-template-columns:1fr}.kb{grid-template-columns:repeat(3,minmax(250px,85vw))}}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-right:8px}
.costbox{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.costbox table.mini td:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:#16181d;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;transition:transform .2s;font-size:15px;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div><b>Admin</b> <small>chỉ chạy trên máy của bạn</small></div><nav class="pages" id="pages"></nav><div class="mrow"><a href="/" target="_blank" rel="noopener">Mở website khách ↗</a></div></header>
<div class="wrap" id="box"></div>
<div class="oveil" id="oveil" data-closeo></div>
<aside class="odr" id="odr" aria-label="Chi tiết đơn"><div id="odrBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script src="common.js"></script>
<script>
{
const {SKIP,esc,CATS,D,vnd,ago,st,rec,catOf,slug,md}=CV;
const $=id=>document.getElementById(id);
const VER=[['web','Website chính thức: domain đúng tên brand, có HTTPS, có trang liên hệ'],['ig','Instagram chính chủ: bio có link về đúng website'],['biz','Thông tin doanh nghiệp: tên công ty, mã số thuế hoặc địa chỉ trên website'],['contact','Đã liên hệ, brand đồng ý cho dùng ảnh (không bắt buộc để duyệt)']];
const TAGS=['Celeb mặc đồ Việt','Chất liệu','Câu chuyện brand','Xu hướng','Lịch sử & di sản','Hướng dẫn'];
let page=(()=>{try{return sessionStorage.getItem('cv_page')||'orders'}catch(e){return 'orders'}})(),kwList=[],pendKw={},warns=[],warnAt='',pw='',tab='warn',selP=new Set(),pend={},catFilter='all',catQ='',brandQ='',limitP=60,syncTxt='',notes=[],editing=null,preview=false;
try{pw=sessionStorage.getItem('cv_pw')||''}catch(e){}
let tt;const toast=(m,ms=2400)=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),ms)};
async function api(path,body,method='POST'){
 try{const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:method==='GET'?undefined:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(r.status===401){pw='';try{sessionStorage.removeItem('cv_pw')}catch(e){}}return {ok:r.ok,status:r.status,j}}
 catch(e){return {ok:false,status:0,j:{error:'Không kết nối được máy chủ. Hãy chạy: python3 serve.py'}}}}
const saveFile=async(file,data)=>{const r=await api('/api/save',{file,data});toast(r.ok?'Đã lưu':(r.j.error||'Lưu không được'));if(r.status===401)render();return r.ok};
function isBack(n){const p=D.byId[n.pid];if(!p)return false;if(!n.variant)return p.in_stock;const v=p.variants.find(x=>x.name===n.variant);return !!v&&v.available}

function render(){
 if(!pw){$('pages').innerHTML='';$('box').innerHTML=`<div class="panel" style="max-width:420px;margin:40px auto"><h2>Đăng nhập</h2><form class="f" id="loginForm"><label>Mật khẩu admin<input type="password" name="pw" required autocomplete="current-password" autofocus></label><button class="btn">Vào</button><p class="note" id="loginMsg"></p></form></div>`;return}
 const left=D.products.filter(p=>catOf(p)==='Khác'&&!D.ov[p.id]?.category).length,back=notes.filter(n=>!n.done&&isBack(n)).length,rv=D.status.filter(b=>rec(b.id).status==='review').length;
 const hi=warns.filter(w=>w.level!=='low').length;
 const newO=orders.filter(o=>(o.status||'new')==='new').length;
 $('pages').innerHTML=`<button class="${page==='orders'?'on':''}" data-page="orders">Quản lý đơn hàng${newO?`<span class="n">${newO}</span>`:''}</button><button class="${page==='shop'?'on':''}" data-page="shop">Quản lý sàn${hi?`<span class="n">${hi}</span>`:''}</button><button data-logout>Thoát</button>`;
 if(page==='orders')return pageOrders();
 const T=[['warn','Cảnh báo',hi],['cat','Sản phẩm',left],['cats','Danh mục'],['content','Nội dung web'],['brand','Brand',rv],['notify','Chờ hàng',back],['journal','Journal'],['clip','Moodboard'],['set','Cài đặt & đồng bộ']];
 if(tab==='order')tab='warn';
 $('box').innerHTML=`<div class="atabs">${T.map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</div><div id="aBody"></div>`;
 ({cats:tCats,content:tContent,warn:tWarn,cat:tCat,brand:tBrand,notify:tNotify,journal:tJournal,clip:tClip,set:tSet})[tab]();
}
const ovOf=p=>D.ov[p.id]||{};
const pins=()=>D.products.filter(p=>ovOf(p).pin).sort((a,b)=>ovOf(a).pin-ovOf(b).pin);
async function saveOv(mut){const ov=JSON.parse(JSON.stringify(D.ov));mut(ov);for(const k in ov){const m=ov[k];if(!m.title)delete m.title;if(!m.hidden)delete m.hidden;if(!m.pin)delete m.pin;if(!Object.keys(m).length)delete ov[k]}if(await saveFile('overrides.json',ov)){D.ov=ov;return true}return false}
const renum=ov=>{Object.entries(ov).filter(([,m])=>m.pin).sort((a,b)=>a[1].pin-b[1].pin).forEach(([,m],i)=>m.pin=i+1)};
const setPend=(id,k,v)=>{const p=D.byId[id],o=ovOf(p),cur={category:o.category??catOf(p),title:o.title??'',hidden:!!o.hidden};pend[id]={...(pend[id]||{}),[k]:v};if(Object.entries(pend[id]).every(([kk,vv])=>cur[kk]===vv))delete pend[id]};
/* --- danh mục --- */
const catRows=()=>CATS.map(k=>({key:k,en:CV.catEN(k),hidden:CV.catHidden(k),custom:!CV.BASE_CATS.includes(k)}));
async function saveCats(rows){const s={...D.set,cats:rows.map(({key,en,hidden})=>({key,en,hidden}))};if(await saveFile('settings.json',s)){D.set=s;CV.applyCats();render()}}
function tCats(){
 const rows=catRows(),cnt=k=>D.products.filter(p=>catOf(p)===k&&!ovOf(p).hidden).length;
 $('aBody').innerHTML=`<div class="panel"><h3>Danh mục trên web</h3><p class="note">Đổi tên tiếng Anh khách thấy, sắp xếp thứ tự (thứ tự này dùng cho các tab trên web), hoặc ẩn cả danh mục. Danh mục bị ẩn thì mọi sản phẩm trong đó cũng ẩn. "Khác" luôn nằm cuối.</p>
 ${rows.map((c,i)=>`<div class="crow" style="grid-template-columns:1fr auto;${c.hidden?'opacity:.55':''}"><div><div class="note" style="margin:0">${esc(c.key)}${c.custom?' · danh mục tự thêm':''} · ${cnt(c.key)} sản phẩm</div>
  <div class="mrow" style="margin-top:6px;align-items:center"><input data-caten="${esc(c.key)}" value="${esc(c.en)}" style="flex:1 1 220px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--card)" aria-label="Tên tiếng Anh">
  <label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" data-cathide="${esc(c.key)}" ${c.hidden?'checked':''} style="width:18px;height:18px"> Ẩn</label></div></div>
  <div class="mrow">${c.key==='Khác'?'':`<button class="btn sm alt" data-cup="${i}" ${i?'':'disabled'} aria-label="Lên">↑</button><button class="btn sm alt" data-cdown="${i}" ${i<rows.length-2?'':'disabled'} aria-label="Xuống">↓</button>`}${c.custom?`<button class="btn sm alt" data-cdel="${esc(c.key)}" style="color:var(--bad)">Xoá</button>`:''}</div></div>`).join('')}</div>
 <div class="panel"><h3>Thêm danh mục</h3><p class="note">Sau khi thêm, đưa sản phẩm vào bằng tab Sản phẩm (chọn nhiều món → Đổi danh mục) hoặc gán từ khoá.</p>
 <form class="f" id="addCat" style="margin-top:8px"><div class="two"><label>Tên tiếng Việt (để bạn nhận biết)<input name="key" required placeholder="VD: Đồ đôi"></label><label>Tên tiếng Anh khách thấy<input name="en" required placeholder="VD: Matching sets"></label></div><button class="btn">Thêm danh mục</button></form></div>`;
}
/* --- nội dung web --- */
let draftC=null;
const inpS='width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:15px';
function tContent(){
 if(!draftC){const C=CV.content();draftC=JSON.parse(JSON.stringify({...C,bar:D.set.content?.bar?.length?C.bar:[]}))}
 const c=draftC;
 $('aBody').innerHTML=`<div class="panel"><h3>Nội dung chữ trên web khách</h3><p class="note">Viết tiếng Anh. Ô thay thế tự điền theo Cài đặt: <b>{eta}</b> thời gian giao · <b>{deposit}</b> % cọc · <b>{ship_flat}</b> giá ship đồng giá · <b>{fee}</b> % phí dịch vụ · <b>{shipping}</b> câu mô tả phí ship · <b>{first_free}</b> ", and your first order ships free" (nếu bật).</p></div>
 <div class="panel"><h3>Thanh thông tin trên cùng</h3><p class="note">Mỗi dòng là một thông tin. Để trống = tự tạo theo Cài đặt (thời gian giao, ship đồng giá, free ship đơn đầu).</p>
 <textarea data-cbar style="${inpS};min-height:90px">${esc(c.bar.join('\n'))}</textarea></div>
 <div class="panel"><h3>Quy trình đặt hàng (cuối trang)</h3>
 <label style="display:grid;gap:4px;font-size:14px;font-weight:600">Câu dẫn<input data-clead value="${esc(c.lead)}" style="${inpS}"></label>
 ${c.steps.map(([t,d],i)=>`<div style="margin-top:12px"><b style="font-size:13px">Bước ${i+1}</b><input data-cstep="${i}:0" value="${esc(t)}" style="${inpS};margin-top:4px;font-weight:600"><textarea data-cstep="${i}:1" style="${inpS};margin-top:4px;min-height:60px">${esc(d)}</textarea></div>`).join('')}</div>
 <div class="panel"><h3>Câu hỏi thường gặp (FAQ)</h3>
 ${c.faq.map(([q,a],i)=>`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="mrow" style="align-items:center"><input data-cfaq="${i}:0" value="${esc(q)}" style="${inpS};flex:1;font-weight:600" aria-label="Câu hỏi">
 <button class="btn sm alt" data-fup="${i}" ${i?'':'disabled'} aria-label="Lên">↑</button><button class="btn sm alt" data-fdown="${i}" ${i<c.faq.length-1?'':'disabled'} aria-label="Xuống">↓</button><button class="btn sm alt" data-fdel="${i}" style="color:var(--bad)" aria-label="Xoá">✕</button></div>
 <textarea data-cfaq="${i}:1" style="${inpS};margin-top:4px;min-height:70px" aria-label="Trả lời">${esc(a)}</textarea></div>`).join('')}
 <button class="btn alt" data-fadd style="margin-top:12px">+ Thêm câu hỏi</button></div>
 <div class="panel"><h3>Giới thiệu cuối trang</h3><textarea data-cabout style="${inpS};min-height:90px">${esc(c.about)}</textarea></div>
 <div class="sticky"><button class="btn" data-csave>Lưu nội dung</button><button class="btn alt" data-creset2>Khôi phục chữ mặc định</button><a class="btn alt" href="/#shop" target="_blank" rel="noopener" style="display:inline-grid;place-items:center;text-decoration:none">Xem web ↗</a></div>`;

const tier=(tbl,kg)=>{const r=tbl.find(([mx])=>kg<=mx+1e-9);return r?r[1]:null};
function freightVND(route,kg,C){
 if(route==='epacket'){const v=tier(C.epacket,kg);return v==null?null:v}
 if(route==='air'){const v=tier(C.air,kg);if(v!=null)return v;const per=tier(C.air_perkg,kg);return Math.ceil(kg*2)/2*per}
 return kg*C.consol_perkg;
}

function estKg(o){const C=COST();return +(o.items.reduce((a,i,k)=>{if(o.confirm&&o.confirm.items?.[k]?.ok===false)return a;const p=D.byId[i.pid];return a+(p?(CV.WEIGHT[catOf(p)]||.5):.5)*i.q},0)+C.pack_kg).toFixed(2)}
function costCalc(o,kg,route){
 const C=COST(),rate=o.rate||D.set.rate,T=tot(o),A=v=>v/rate;
 const live=o.items.map((i,k)=>({i,k,ok:o.confirm?.items?.[k]?.ok??true,price:o.confirm?.items?.[k]?.price??i.price_vnd})).filter(x=>x.ok);
 const goodsV=live.reduce((a,x)=>a+x.price*x.i.q,0),brands=new Set(live.map(x=>x.i.brand)).size;
 const revGoods=A(goodsV),revShip=+(T.shipFinal??T.ship??0),revFee=+(T.fee||0),revGst=+(T.gst||0);
 const fV=freightVND(route,kg,C);
 const cost={goods:A(goodsV),vn:A(brands*C.vn_inbound),pack:A(C.packaging),freight:fV==null?null:A(fV),au:route==='consol'?ausPost(kg,C):0,pay:A(goodsV)*C.pay_fee_pct/100,extra:+C.extra_aud||0};
 const revenue=revGoods+revShip+revFee,costs=Object.values(cost).reduce((a,v)=>a+(v||0),0);
 const shipCost=(cost.freight||0)+cost.au+cost.vn+cost.pack;
 return {kg,route,rev:{goods:revGoods,ship:revShip,fee:revFee,gst:revGst},cost,revenue,costs,profit:revenue-costs,shipCost,breakEvenShip:shipCost+cost.pay+cost.extra-revFee,brands,invalid:fV==null};
}

async function pullOnline(quiet){if(!quiet)toast('Đang lấy đơn…');
 const r=await api('/api/pull',{});if(!r.ok)return toast(r.j.error||'Không lấy được');const j=r.j;await loadOrders();if(j.data){await CV.load('/');await loadWarns()}
 const m=[j.orders?j.orders+' đơn mới':'',j.notify?j.notify+' đăng ký báo hàng':'',j.data?'dữ liệu sản phẩm mới':''].filter(Boolean).join(', ');
 const msg=[m?'Đã lấy: '+m:'',...j.msgs].filter(Boolean).join(' · ')||'Không có đơn mới';
 if(m||j.msgs.length||!quiet)toast(msg,j.msgs.length?9000:undefined);render()}
async function loadPay(){const q=await api('/api/private?file=payment.json',null,'GET');payInfo=q.ok?(q.j.text||''):'';contact=q.ok?{name:q.j.sign_name||'',phone:q.j.phone||'',email:q.j.email||''}:{}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId){openId=null;composing=null;redraw()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',async e=>{const col=e.target.closest?.('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain'),o=orders.find(x=>x.id===id),C=COLS.find(c=>c.k===col.dataset.drop);if(!o||!C||C.st.includes(o.status||'new'))return;await setStatus(id,C.k==='c1'&&!o.confirm?'new':C.to)});
CV.load('/').then(async()=>{if(pw){await loadNotes();await loadWarns();await loadPay();await loadRemote();await loadOrders()}render();if(pw)pullOnline(true)});
}
</script>
</body>
</html>
